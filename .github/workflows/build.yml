name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate Gradle project
        id: locate
        run: |
          echo "Repo contents:"
          find . -maxdepth 3 -not -path './.git/*' | sort
          SETTINGS=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle found anywhere in the repo. Upload the extracted project files (not the .zip)."
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Gradle project found in: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
          build-root-directory: ${{ steps.locate.outputs.dir }}

      - name: Build
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: vapelike-mod
          path: |
            ${{ steps.locate.outputs.dir }}/build/libs/*.jar
            !${{ steps.locate.outputs.dir }}/build/libs/*-sources.jar
          if-no-files-found: error
